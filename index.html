<meta name="description" content="合同管理平台：合同、发票、资金、客户与供应商一站式管理" data-page-node-id="t1A6rSUGj492rEgAw6tIro">
<style>:root{
  --bg:#f4f6fa; --card:#ffffff; --line:#e7eaf2; --line2:#d7dce8;
  --ink:#1c2433; --ink2:#5a6478; --ink3:#9aa3b5;
  --brand:#3d5ee8; --brand-d:#2c48c4; --brand-bg:#eef1fd;
  --ok:#129b5a; --ok-bg:#e6f7ef; --bad:#d4382e; --bad-bg:#fdeeec;
  --warn:#c47b0a; --warn-bg:#fdf3e0; --info:#2f6fdb; --info-bg:#e9f1fc;
  --gray:#6b7280;
  --r:10px; --rs:8px;
  --shadow:0 1px 2px rgba(20,30,60,.04),0 4px 14px rgba(20,30,60,.05);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}
button{font-family:inherit}
input,select,textarea{font-family:inherit;font-size:14px}
a{color:var(--brand);text-decoration:none}
svg{display:block}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#ccd3e2;border-radius:8px}
::-webkit-scrollbar-track{background:transparent}

#app{display:none}
body.ready #app{display:flex;height:100vh;overflow:hidden}

/* ============ 认证页（登录/授权） ============ */
#authWrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:
  radial-gradient(1200px 500px at 85% -10%,#e8edff 0%,transparent 55%),
  radial-gradient(900px 420px at -10% 110%,#e9f7f1 0%,transparent 50%),var(--bg)}
#authCard{width:100%;max-width:392px;background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:34px 32px 26px}
.auth-logo{width:54px;height:54px;border-radius:14px;background:linear-gradient(135deg,#4c6ff0,#2f48c8);display:flex;align-items:center;justify-content:center;margin:0 auto 14px;color:#fff}
.auth-name{text-align:center;font-size:20px;font-weight:600}
.auth-sub{text-align:center;font-size:12.5px;color:var(--ink3);margin:4px 0 22px}
.tabs{display:flex;background:var(--bg);border-radius:9px;padding:3px;margin-bottom:18px}
.tabs button{flex:1;border:none;background:transparent;padding:7px 0;border-radius:7px;font-size:13px;color:var(--ink2);cursor:pointer}
.tabs button.on{background:#fff;color:var(--brand);font-weight:500;box-shadow:0 1px 3px rgba(20,30,60,.08)}
.f-label{font-size:12.5px;color:var(--ink2);margin:14px 0 6px;display:block}
.f-label:first-child{margin-top:0}
.inp{width:100%;border:1px solid var(--line2);border-radius:var(--rs);padding:9px 12px;background:#fff;color:var(--ink);outline:none;transition:border .15s,box-shadow .15s}
.inp:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(61,94,232,.12)}
textarea.inp{resize:vertical;min-height:72px;line-height:1.6}
select.inp{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink3) 50%),linear-gradient(135deg,var(--ink3) 50%,transparent 50%);background-position:calc(100% - 16px) 55%,calc(100% - 11px) 55%;background-size:5px 5px;background-repeat:no-repeat;padding-right:26px}
.btn{border:1px solid var(--line2);background:#fff;color:var(--ink);border-radius:var(--rs);padding:7px 13px;font-size:13px;cursor:pointer;transition:all .15s;white-space:nowrap}
.btn:hover{border-color:#b9c2d6;background:#f7f9fd}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.pri:hover{background:var(--brand-d)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.ok:hover{background:#0e7f4a}
.btn.bad{background:#fff;border-color:#f0b9b5;color:var(--bad)}
.btn.bad:hover{background:var(--bad-bg)}
.btn.warn{background:#fff;border-color:#eac388;color:var(--warn)}
.btn.warn:hover{background:var(--warn-bg)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink2)}
.btn.ghost:hover{background:var(--bg);color:var(--ink)}
.btn.sm{padding:3px 9px;font-size:12.5px;border-radius:6px}
.btn.block{width:100%;padding:10px}
.hint{font-size:12px;color:var(--ink3);line-height:1.7}
.msg{font-size:13px;line-height:1.6;margin-top:8px}
.msg.err{color:var(--bad)} .msg.ok{color:var(--ok)}

/* ============ 主框架 ============ */
#aside{width:224px;flex:none;background:var(--card);border-right:1px solid var(--line);display:flex;flex-direction:column}
.aside-logo{display:flex;align-items:center;gap:10px;padding:15px 16px;border-bottom:1px solid var(--line)}
.aside-logo .lg{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#4c6ff0,#2f48c8);color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.aside-logo .nm{font-size:14.5px;font-weight:600;line-height:1.25}
.aside-logo .vn{font-size:10.5px;color:var(--ink3)}
#nav{flex:1;overflow-y:auto;padding:8px 10px 12px}
.nav-group{font-size:11px;color:var(--ink3);padding:12px 8px 5px;letter-spacing:1px}
.nav-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:var(--ink2);cursor:pointer;font-size:13.5px;margin-bottom:1px;user-select:none}
.nav-item:hover{background:var(--bg);color:var(--ink)}
.nav-item.on{background:var(--brand-bg);color:var(--brand);font-weight:500}
.nav-item svg{flex:none}
.nav-item .cnt{margin-left:auto;font-size:11px;background:#eef1f6;color:var(--ink2);border-radius:99px;padding:0 7px;min-width:20px;text-align:center}
.nav-item.on .cnt{background:#dbe3fb;color:var(--brand)}
#main{flex:1;display:flex;flex-direction:column;min-width:0}
#topbar{height:56px;flex:none;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 20px;gap:12px}
.ttl{font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#topbar .crumb{color:var(--ink3);font-size:12px}
#content{flex:1;overflow-y:auto;padding:20px 22px 60px}
#menuBtn{display:none}

/* ============ 卡片/区块 ============ */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;margin-bottom:14px}
.stat-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow)}
.stat-card .lb{font-size:12.5px;color:var(--ink2);display:flex;align-items:center;gap:6px}
.stat-card .val{font-size:24px;font-weight:600;margin-top:6px;letter-spacing:-.3px}
.stat-card .val small{font-size:12px;color:var(--ink3);font-weight:400}
.stat-card .ex{font-size:11.5px;color:var(--ink3);margin-top:2px}
.stat-card .ico{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;margin-left:auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);margin-bottom:14px}
.card .ch{padding:13px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;font-size:14.5px;font-weight:500}
.card .ch .r{margin-left:auto;display:flex;gap:8px;align-items:center}
.card .bd{padding:14px 16px}
.seg{display:flex;gap:6px;background:var(--bg);padding:3px;border-radius:9px;width:max-content;flex-wrap:wrap;max-width:100%}
.seg button{border:none;background:transparent;padding:5px 14px;border-radius:7px;font-size:13px;color:var(--ink2);cursor:pointer}
.seg button.on{background:#fff;color:var(--brand);font-weight:500;box-shadow:0 1px 3px rgba(20,30,60,.1)}

/* ============ 表格 ============ */
.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:13px;white-space:nowrap}
.tbl th{background:#f7f9fc;color:var(--ink2);font-weight:500;text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:1}
.tbl td{padding:9px 12px;border-bottom:1px solid #eef1f6;color:var(--ink)}
.tbl tr:hover td{background:#fafbfe}
.tbl .num{font-variant-numeric:tabular-nums;text-align:right}
.tbl th.num{text-align:right}
.tbl .tac{text-align:center}
.tbl th.tac{text-align:center}
.muted{color:var(--ink3)}
.strong{font-weight:500}
.money{font-variant-numeric:tabular-nums;font-weight:500}
.blank{padding:40px 0;text-align:center;color:var(--ink3);font-size:13px}
.blank svg{margin:0 auto 10px;opacity:.4}
.ops button{margin-right:0}

/* ============ 标签 ============ */
.tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:1px 9px;border-radius:99px;white-space:nowrap}
.tag.ok{background:var(--ok-bg);color:var(--ok)}
.tag.bad{background:var(--bad-bg);color:var(--bad)}
.tag.warn{background:var(--warn-bg);color:var(--warn)}
.tag.info{background:var(--info-bg);color:var(--info)}
.tag.gray{background:#f0f2f6;color:var(--gray)}
.tag.brand{background:var(--brand-bg);color:var(--brand)}
.tag.plain{background:transparent;border:1px solid var(--line2);color:var(--ink2)}
.dot{width:6px;height:6px;border-radius:50%;display:inline-block}
.money-pos{color:var(--ok);font-weight:500}
.money-neg{color:var(--bad);font-weight:500}

/* ============ 筛选条 ============ */
.filter{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.filter .inp{width:auto;min-width:120px;padding:6px 10px;font-size:13px}
.filter .sp{flex:1}
.toolbar{display:flex;gap:8px;align-items:center;padding:12px 14px;flex-wrap:wrap}
.toolbar .sp{flex:1}

/* ============ 弹窗 ============ */
#mask{position:fixed;inset:0;background:rgba(15,23,42,.42);z-index:90;display:none;align-items:flex-start;justify-content:center;padding:5vh 14px 20px;overflow-y:auto}
body.modal-open #mask{display:flex}
.modal{background:#fff;border-radius:14px;width:100%;max-width:760px;box-shadow:0 18px 60px rgba(10,20,50,.22);animation:pop .16s ease}
.modal.sm{max-width:440px}.modal.lg{max-width:980px}.modal.xl{max-width:1120px}
@keyframes pop{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
.modal .mh{display:flex;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line);font-size:15px;font-weight:600;cursor:default}
.modal .mh .x{margin-left:auto;border:none;background:var(--bg);width:26px;height:26px;border-radius:7px;color:var(--ink2);cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center}
.modal .mh .x:hover{background:#fbe6e4;color:var(--bad)}
.modal .mb{padding:16px 18px;max-height:calc(100vh - 160px);overflow-y:auto}
.modal .mf{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--line)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 18px}
.form-grid .full{grid-column:1/-1}
.fg{margin-bottom:10px}
.fg label{display:block;font-size:12.5px;color:var(--ink2);margin-bottom:4px}
.fg label i{color:var(--bad);font-style:normal;margin-left:2px}
.fg .inp{width:100%}
.two{display:flex;gap:8px}
.two .inp{flex:1}

/* 详情抽屉 */
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:#fff;z-index:95;box-shadow:-8px 0 30px rgba(10,20,50,.16);transform:translateX(105%);transition:transform .2s ease;display:flex;flex-direction:column}
body.drawer-open #drawer{transform:none}
#drawer .mh{display:flex;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line);font-weight:600}
#drawer .mb{flex:1;overflow-y:auto;padding:16px 18px}
.kv{display:grid;grid-template-columns:repeat(2,1fr);gap:2px 18px;font-size:13px}
.kv .it{display:flex;padding:6px 0;border-bottom:1px dashed #f0f2f7}
.kv .k{color:var(--ink3);width:92px;flex:none}
.kv .v{flex:1;word-break:break-all}

/* ============ Toast ============ */
#toast{position:fixed;top:18px;left:50%;transform:translateX(-50%) translateY(-80px);z-index:200;background:#232c3d;color:#fff;font-size:13px;padding:9px 18px;border-radius:10px;box-shadow:0 6px 24px rgba(0,0,0,.18);opacity:0;transition:all .25s;pointer-events:none;max-width:88vw}
#toast.show{transform:translateX(-50%) translateY(0);opacity:1}
#toast.ok{background:#0e8a52}#toast.err{background:#c73a2f}#toast.warn{background:#b06b08}

/* ============ 明细行编辑器 ============ */
.items-editor td .inp{padding:5px 8px;font-size:13px}
.items-editor .rm{color:var(--bad);background:none;border:none;cursor:pointer;font-size:15px}
.mini-tbl{width:100%;border-collapse:collapse}
.mini-tbl th{font-size:12px;color:var(--ink2);background:var(--bg);padding:6px 8px;border:1px solid var(--line)}
.mini-tbl td{border:1px solid var(--line);padding:0}
.mini-tbl td .inp{border:none;border-radius:0;box-shadow:none;padding:6px 8px;background:transparent}
.mini-tbl td .inp:focus{background:#fff}

/* ============ 进度条 ============ */
.pbar{height:6px;border-radius:6px;background:#eef1f6;overflow:hidden;min-width:70px}
.pbar i{display:block;height:100%;background:var(--brand);border-radius:6px}
.pbar i.green{background:var(--ok)}.pbar i.amber{background:var(--warn)}.pbar i.red{background:var(--bad)}
.pct{font-size:11.5px;color:var(--ink3);white-space:nowrap}

/* ============ 附件 ============ */
.att{display:inline-flex;align-items:center;gap:6px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:4px 10px;font-size:12.5px;color:var(--ink);margin:0 6px 6px 0}
.att .rm{color:var(--bad);background:none;border:none;cursor:pointer;font-size:13px}

/* ============ 图表/进度等 ============ */
.chart-box{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.chart-box .card{min-width:0;overflow-x:auto}
.st3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
@media(max-width:820px){.chart-box{grid-template-columns:1fr}}
@media(max-width:640px){.st3{grid-template-columns:1fr}}

/* ============ 数据导入 ============ */
.dropzone{border:1.5px dashed var(--line2);border-radius:var(--r);padding:26px;text-align:center;color:var(--ink2);cursor:pointer;transition:all .15s;background:#fbfcfe}
.dropzone:hover{border-color:var(--brand);background:var(--brand-bg)}
.dropzone.on{border-color:var(--brand);background:var(--brand-bg)}

/* ============ 用户/角色 ============ */
.role-row{display:flex;gap:14px;flex-wrap:wrap}
.role-row .rr{flex:1;min-width:230px;border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;background:#fff}
.role-row .rr h4{font-size:14px;margin-bottom:4px;display:flex;align-items:center;gap:8px}
.perm-line{font-size:12px;color:var(--ink2)}

/* ============ 响应式 ============ */
@media(max-width:920px){
  #aside{position:fixed;left:0;top:0;bottom:0;z-index:80;transform:translateX(-105%);transition:transform .2s;box-shadow:6px 0 24px rgba(10,20,50,.12)}
  body.menu-open #aside{transform:none}
  #menuBtn{display:flex;border:none;background:var(--bg);width:34px;height:34px;border-radius:8px;align-items:center;justify-content:center;color:var(--ink2);cursor:pointer}
  #content{padding:14px 12px 70px}
  #topbar{padding:0 12px}
  .form-grid{grid-template-columns:1fr}
  .kv{grid-template-columns:1fr}
}
</style>
</head>

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function pad(n,w){n=String(n);while(n.length<(w||2))n='0'+n;return n}
function today(){const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function now(){const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+' '+pad(d.getHours())+':'+pad(d.getMinutes())}
function todayCN(){const d=new Date();return d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日'}
function fmtDate(s){if(!s)return '—';const d=new Date(s);if(isNaN(d))return s;return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function fmtMoney(n){if(n==null||isNaN(n))n=0;const neg=n<0;const s=Math.abs(Number(n)).toFixed(2);const p=s.split('.');let i=p[0].replace(/\B(?=(\d{3})+(?!\d))/g,',');return (neg?'-':'')+'¥'+i+(p[1]==='00'?'':'.'+p[1])}
function fmtMoneyFull(n){if(n==null||isNaN(n))n=0;return (n<0?'-':'')+'¥'+Math.abs(Number(n)).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2})}
function moneyIn(n){const v=parseFloat(n);return isFinite(v)?v:0}
function moneyStr(n){return Number(n||0).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2})}
function taxCalc(amount,taxRate){const r=Number(taxRate)||0;return {taxExcl:Number((amount/(1+r)).toFixed(2)),tax:Number((amount-amount/(1+r)).toFixed(2))}}
function taxExclToAmount(taxExcl,taxRate){const r=Number(taxRate)||0;return Number((taxExcl*(1+r)).toFixed(2))}
function daysAgo(n){const d=new Date();d.setDate(d.getDate()+n);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function diffDays(a,b){const A=new Date(a).getTime(),B=new Date(b).getTime();if(isNaN(A)||isNaN(B))return NaN;return Math.round((B-A)/86400000)}
let _toastTimer=null;
function toast(msg,type){const t=document.getElementById('toast');t.textContent=msg;t.className='show '+(type||'');clearTimeout(_toastTimer);_toastTimer=setTimeout(()=>t.className='',2200)}
function confirmDlg(msg,cb,okText){openModal('<div style="text-align:center"><div style="font-size:15px;font-weight:600;margin:8px 0 6px">请确认</div><p class="hint" style="margin-bottom:6px">'+esc(msg)+'</p></div>',{footer:[{t:'取消',c:'ghost',x:closeModal},{t:okText||'确认',c:'bad',x:()=>{closeModal();cb&&cb()}}],sm:true})}
function debounce(fn,ms){let t;return function(){clearTimeout(t);const a=arguments;t=setTimeout(()=>fn.apply(null,a),ms||250)}}
function downloadFile(name,content,mime){const blob=new Blob([content],{type:mime||'text/plain;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(url);a.remove()},300)}
function readFileText(file,cb){const r=new FileReader();r.onload=e=>cb(e.target.result);r.readAsText(file)}
function exportCsv(name,headers,rows){const q=s=>'"'+String(s==null?'':s).replace(/"/g,'""')+'"';const lines=[headers.map(q).join(',')].concat(rows.map(r=>r.map(c=>q(c)).join(',')));downloadFile(name,'\ufeff'+lines.join('\r\n'),'text/csv;charset=utf-8')}

/* ================= 02 数据层 ================= */
const Store={
  get(key,def){try{const v=localStorage.getItem(STORE_KEY+key);if(v==null)return def;return JSON.parse(v)}catch(e){return def}},
  set(key,val){try{localStorage.setItem(STORE_KEY+key,JSON.stringify(val))}catch(e){toast('保存失败：浏览器存储空间不足','err')}},
  remove(key){localStorage.removeItem(STORE_KEY+key)}
};
/* 域：

 客户/供应商/合同/发票/资金单据/提醒 均带 companyId 字段按公司隔离
*/
const DOMAINS=['customers','suppliers','contracts','invoices','fundBills','otherBills','transfers','accounts','reminders','contractType','customerCat','supplierCat'];
function dbList(key){const v=Store.get(key);return Array.isArray(v)?v:[]}
function saveList(key,list){Store.set(key,list)}
function getSettings(){let s=Store.get('settings');if(!s||typeof s!=='object')s={};return s}
function saveSettings(s){Store.set('settings',s)}
function addLog(action,detail){const logs=dbList('logs');logs.unshift({id:uid(),time:now(),user:curUser()?curUser().realName||curUser().username:'—',action,detail:detail||''});if(logs.length>500)logs.length=500;saveList('logs',logs)}
function nextNum(prefix){const s=getSettings();s.cnt=s.cnt||{};const n=(s.cnt[prefix]||0)+1;s.cnt[prefix]=n;saveSettings(s);return prefix+'-'+new Date().getFullYear()+'-'+pad(n,4)}
/* 无账号体系：当前身份 = 授权激活人（license.owner）；未激活返回 null（写操作被 canWrite 拦截） */
function curUser(){const l=Store.get('license');return (l&&l.activated)?{id:'OWNER',username:'OWNER',realName:l.owner||'授权用户',role:'ADMIN'}:null}
function curCompany(){const id=Store.get('curCompanyId',null);if(id==null)return null;const c=dbList('companies').find(x=>x.id===id);return c||null}
function curCompanyId(){const c=curCompany();return c?c.id:null}
function scopeList(key){const cid=curCompanyId();if(cid==null)return dbList(key);return dbList(key).filter(x=>x.companyId===cid)}
function saveScoped(key,list){const cid=curCompanyId();if(cid==null){saveList(key,list);return}const all=dbList(key);const rest=all.filter(x=>x.companyId!==cid);saveList(key,rest.concat(list))}
/* 编号规则：settings.rules = {contract:'HT',invoice:'FP',fund:'SK',other:'QT',transfer:'ZZ',customer:'KH',supplier:'GYS'} */
function rulePrefix(kind){const s=getSettings();s.rules=s.rules||{};return s.rules[kind]||defaultRules()[kind]}
function defaultRules(){return {contract:'HT',invoice:'FP',fund:'SK',other:'QT',transfer:'ZZ',customer:'KH',supplier:'GYS'}}
function getOpt(key,def){const s=getSettings();s.opt=s.opt||{};return s.opt[key]!==undefined?s.opt[key]:def}

function getDeviceId(){let d=localStorage.getItem(STORE_KEY+'device_id');if(!d){d='dev-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,10);localStorage.setItem(STORE_KEY+'device_id',d)}return d}
function getLicense(){const l=Store.get('license');return (l&&typeof l==='object')?l:{activated:false,code:'',owner:''}}
function isLicensed(){return !!getLicense().activated}
function signCode(seg){
  let h=LICENSE_SEED;
  for(let i=0;i<seg.length;i++){h=((h*33+seg.charCodeAt(i))^LICENSE_KEY)>>>0}
  let n=h%1048576,s='';
  for(let i=0;i<4;i++){s=CODE_CHARS[n%32]+s;n=Math.floor(n/32)}
  return s;
}
function isValidCode(code){const m=LICENSE_PAT.exec((code||'').toUpperCase().trim());if(!m)return false;return signCode(m[1])===m[2]}
function activateOffline(code,owner){
  if(!isValidCode(code)){toast('激活码无效，请核对后重试','err');return false}
  const lic=getLicense();
  if(lic.activated&&lic.code&&lic.code!==code){toast('本设备已用其他激活码激活，请先解除激活','warn');return false}
  if(lic.activated&&lic.code===code){toast('该激活码在本设备已激活');return true}
  Store.set('license',{activated:true,code:(code||'').toUpperCase(),owner:owner||'',devices:[getDeviceId()],activatedAt:now()});
  addLog('激活','激活码 '+code);
  return true;
}
function deactivateLicense(){if(!confirmDlg2('解除激活','解除后本设备将回到试用模式（仅浏览示例，无法新增/编辑），确定解除？'))return;Store.set('license',{activated:false,code:'',owner:''});location.reload()}

function unreadReminderCount(){const cid=curCompanyId();return scopeList('reminders').filter(r=>r.status===0&&(!cid||r.companyId===cid)).length}
function genReminders(){
  const cid=curCompanyId();if(!cid)return;
  const cons=dbList('contracts').filter(c=>c.companyId===cid&&c.status!=='stopped'&&c.status!=='done'&&!c.archive&&c.endDate);
  let added=0;
  const rems=dbList('reminders');
  cons.forEach(c=>{
    const left=diffDays(today(),c.endDate);
    if(!isFinite(left))return;
    if(left>=0&&left<=30&&!rems.some(r=>r.refId==='c_exp_'+c.id&&r.companyId===cid&&r.status===0)){
      rems.push({id:uid(),companyId:cid,kind:'contract_expire',title:'合同即将到期：「'+c.name+'」',refId:'c_exp_'+c.id,due:c.endDate,status:0,createdAt:now()});added++;
    }
  });
  if(added)saveList('reminders',rems);
  return added;
}
function fmtStatus(s){return {unsigned:'未签订',signed:'已签订',done:'已完成',stopped:'已终止'}[s]||s}
function stTag(s){
  const m={unsigned:['warn','未签订'],signed:['info','已签订'],done:['ok','已完成'],stopped:['gray','已终止']}[s];
  return m?'<span class="tag '+m[0]+'">'+m[1]+'</span>':esc(s);

function archTag(a){return a? '<span class="tag gray">已归档</span>':''}
function dirTag(d){return d==='应收'?'<span class="tag brand">应收</span>':'<span class="tag warn" style="background:#f3e8fd;color:#7c3aed">应付</span>'}
function payTag(rate){if(rate==null)return '<span class="tag gray">—</span>';if(rate<=0)return '<span class="tag bad">未收款</span>';if(rate>=100)return '<span class="tag ok">已收款</span>';return '<span class="tag warn">部分收款</span>'}
function progressBar(rate){rate=Math.max(0,Math.min(100,Number(rate)||0));const c=rate>=100?'green':rate>=50?'':'amber';return `<div style="display:flex;align-items:center;gap:8px"><div class="pbar"><i class="${rate>=100?'green':rate>0?'amber':''}" style="width:${rate}%"></i></div><span class="pct">${Number(rate).toFixed(1)}%</span></div>`}

const PARTNER_TAB={customer:{filters:['全部客户','重要客户','普通客户','重点客户','潜在客户']},supplier:{filters:['全部供应商','重要供应商','普通供应商']}};

function partnerState(){STATE.pt=STATE.pt||{};return STATE.pt}
function partnerListData(kind){
  const st=partnerState();
  const kw=(st[kind+'Kw']||'').toLowerCase();
  let list=scopeList(kind==='customer'?'customers':'suppliers');
  if(kw)list=list.filter(x=>(x.name||'').toLowerCase().includes(kw)||(x.contact||'').toLowerCase().includes(kw)||(x.phone||'').includes(kw)||(x.code||'').toLowerCase().includes(kw));

}

function openPartnerImport(kind){
  if(!requireLic())return;
  const isC=kind==='customer';const title=isC?'客户':'供应商';
  openModal(`<div style="font-size:13px">
    <div class="dropzone" onclick="$('piFile').click()">${ICO.upload} 点击选择 CSV 文件（或拖拽到窗口）<div class="hint">表头：名称,联系人,电话,地址,分类,税号,备注（首列必填名称）</div></div>
    <input type="file" id="piFile" accept=".csv,text/csv" style="display:none" onchange="importPartnerFile(this,'${kind}')">
    <div class="hint" style="margin-top:10px">也可先在列表页「导出」获得模板，按模板填写后导入。</div>
    <div id="piMsg"></div>
  </div>`,{title:'导入'+title+'（CSV）',footer:[{t:'关闭',x:closeModal}]});
}
function importPartnerFile(inp,kind){
  const f=inp.files[0];if(!f)return;
  readFileText(f,txt=>{
    const isC=kind==='customer';const title=isC?'客户':'供应商';const key=isC?'customers':'suppliers';
    const lines=txt.replace(/^\ufeff/,'').split(/\r?\n/).filter(l=>l.trim());
    let ok=0,fail=0;
    const list=scopeList(key);
    lines.forEach((ln,idx)=>{
      if(idx===0&&ln.includes('名称'))return;
      const cols=parseCsvLine(ln);const name=(cols[0]||'').trim();if(!name){fail++;return}
      list.unshift({id:uid(),companyId:curCompanyId(),code:rulePrefix(isC?'customer':'supplier')+'-'+new Date().getFullYear()+'-'+pad(list.length+1,4),name,category:(cols[4]||'').trim(),contact:(cols[1]||'').trim(),phone:(cols[2]||'').trim(),address:(cols[3]||'').trim(),taxNo:(cols[5]||'').trim(),remark:(cols[6]||'').trim(),followUps:[],createdAt:now()});
      ok++;
    });
    saveScoped(key,list);
    const m=$('piMsg');m.innerHTML='<div class="msg ok">导入完成：成功 '+ok+' 条'+(fail?'，跳过 '+fail+' 条':'')+'</div>';
    addLog('导入'+title,'成功 '+ok+' 条');
    renderPartnerTable(kind);
  });
}
function parseCsvLine(line){const out=[];let cur='',q=false;for(let i=0;i<line.length;i++){const ch=line[i];if(q){if(ch==='"'){if(line[i+1]==='"'){cur+='"';i++}else q=false}else cur+=ch}else{if(ch==='"')q=true;else if(ch===','){out.push(cur);cur=''}else cur+=ch}}out.push(cur);return out}

/* ================= 06 合同台账（应收 / 应付） ================= */
const CONTRACT_STATUS=['unsigned','signed','done','stopped'];
function conState(){STATE.con=STATE.con||{};return STATE.con}
PAGES.contract=function(){
  const st=conState();st.dir=st.dir||'应收';

      <select class="inp" id="conType"><option value="">全部类型</option>${contractTypesOf(st.dir).map(t=>`<option value="${esc(t.name)}">${esc(t.name)}</option>`).join('')}</select>

AFTER.contract=function(){bindConSearch();renderConList()}
function setConDir(dir){conState().dir=dir;const ct=$('content');if(ct)ct.innerHTML=PAGES.contract();bindConSearch();renderConList()}
function contractTypesOf(dir){return dictGet('contractType').filter(t=>!t.direction||t.direction===dir)}
function conFiltered(){
  const st=conState();
  const kw=(st.kw||'').toLowerCase();
  let list=scopeList('contracts').filter(c=>c.direction===st.dir);
  if(kw)list=list.filter(c=>(c.name||'').toLowerCase().includes(kw)||(c.number||'').toLowerCase().includes(kw)||(c.partnerName||'').toLowerCase().includes(kw)||(c.manager||'').toLowerCase().includes(kw));
  if(st.status)list=list.filter(c=>c.status===st.status);
  if(st.arch!==undefined&&st.arch!=='')list=list.filter(c=>String(c.archive||0)===st.arch);
  if(st.type)list=list.filter(c=>c.typeName===st.type);
  return list.sort((a,b)=>(b.createdAt||'').localeCompare(a.createdAt||''));
}
function bindConSearch(){
  const kw=$('conKw'),ss=$('conStatus'),ar=$('conArch'),ty=$('conType');if(!kw)return;
  const st=conState();
  kw.oninput=debounce(function(){st.kw=kw.value;renderConList()},250);
  ss.onchange=function(){st.status=ss.value||'';renderConList()};
  ar.onchange=function(){st.arch=ar.value;renderConList()};
  ty.onchange=function(){st.type=ty.value||'';renderConList()};
}
function conMoney(c){
  const bills=dbList('fundBills').filter(b=>b.contractId===c.id&&b.companyId===c.companyId);
  const invs=dbList('invoices').filter(i=>i.contractId===c.id&&i.companyId===c.companyId);
  const inB=isRecvCon(c);
  const got=bills.filter(b=>b.kind==='收款').reduce((s,b)=>s+moneyIn(b.amount),0);
  const paid=bills.filter(b=>b.kind==='付款').reduce((s,b)=>s+moneyIn(b.amount),0);
  const invOut=invs.filter(i=>i.direction==='销项').reduce((s,i)=>s+moneyIn(i.amount),0);
  const invIn=invs.filter(i=>i.direction==='进项').reduce((s,i)=>s+moneyIn(i.amount),0);
  const amt=moneyIn(c.amount);
  return {amt,got,paid,invOut,invIn,rate:amt?got/amt*100:0};
}
function isRecvCon(c){return (c.direction||'应收')==='应收'}
function renderConList(){
  const el=$('conList');if(!el)return;
  const st=conState();const list=conFiltered();
  const sums=list.reduce((s,c)=>{const m=conMoney(c);const a=moneyIn(c.amount);if(isRecvCon(c)){s.amt+=a;s.pro+=m.got}else{s.amt+=a;s.pro+=m.paid}return s},{amt:0,pro:0});
  $('conSummary').textContent='共 '+list.length+' 份 · 合同金额合计 '+fmtMoney(sums.amt)+' · 已收付 '+fmtMoney(sums.pro);

function addAttToCon(cid,file){

  if(file.size>800*1024){toast('附件过大，请压缩到 800KB 内（浏览器本地存储有限）','warn');return}
  const r=new FileReader();
  r.onload=e=>{
    c.atts=c.atts||[];c.atts.push({name:file.name,dataUrl:e.target.result,size:file.size,type:file.type,at:now()});
    saveScoped('contracts',list);renderAttsInto(cid);toast('附件已添加');
  };
  r.readAsDataURL(file);
}

function conAct(id,act){
  if(!requireLic())return;
  const list=scopeList('contracts');const c=list.find(x=>x.id===id);if(!c)return;
  const t={signed:['确定将该合同标记为「已签订」？','已签订'],done:['确定将该合同标记为「已完成」？','已完成'],stopped:['确定终止该合同？终止后不再生成提醒。','已终止'],archive:['确定归档该合同？','已归档'],unarchive:['确定取消归档？','已取消归档']}[act];
  if(!t)return;
  confirmDlg(t[0],()=>{
    if(act==='signed'){c.signDate=c.signDate||today();c.status='signed'}
    else if(act==='done'){c.status='done'}
    else if(act==='stopped'){c.status='stopped'}
    else if(act==='archive'){c.archive=1}
    else if(act==='unarchive'){c.archive=0}
    saveScoped('contracts',list);addLog('合同操作',c.name+' → '+t[1]);closeDrawer();renderConList();genReminders();toast(t[1]);
  });
}

function moneyAgg(list,f){return list.reduce((s,x)=>s+moneyIn(f(x)),0)}
function statDetailHtml(){

  const payAmt=moneyAgg(pays,c=>c.amount);

  const paid=moneyAgg(bills.filter(b=>b.kind==='付款'),b=>b.amount);
  const invOut=moneyAgg(invs.filter(i=>i.direction==='销项'),i=>i.amount);
  const invIn=moneyAgg(invs.filter(i=>i.direction==='进项'),i=>i.amount);
  const oIn=moneyAgg(others.filter(o=>o.kind==='收入'),o=>o.amount);
  const oOut=moneyAgg(others.filter(o=>o.kind==='支出'),o=>o.amount);
  const net=(got+oIn)-(paid+oOut);
  return `
  <div class="cards">
    ${statCard('应收合同总额',fmtMoneyFull(recvAmt),'已收 '+fmtMoneyFull(got),'#3d5ee8',ICO.contract)}
    ${statCard('应付合同总额',fmtMoneyFull(payAmt),'已付 '+fmtMoneyFull(paid),'#7c3aed',ICO.supplier)}
    ${statCard('已开票（销项）',fmtMoneyFull(invOut),'占应收 '+(recvAmt?(invOut/recvAmt*100).toFixed(1):0)+'%','#2f6fdb',ICO.invoice)}
    ${statCard('已收票（进项）',fmtMoneyFull(invIn),'占应付 '+(payAmt?(invIn/payAmt*100).toFixed(1):0)+'%','#0891b2',ICO.doc)}
    ${statCard('其他收入',fmtMoneyFull(oIn),'','#129b5a',ICO.money)}
    ${statCard('其他支出',fmtMoneyFull(oOut),'','#d4382e',ICO.money)}
  </div>
  <div class="card" style="box-shadow:none;border:none;margin:0;padding:0"><div class="bd" style="padding:0">
    <div style="font-weight:500;margin:2px 0 10px">资金净流入（累计收付相抵）</div>
    <div style="font-size:26px;font-weight:600;${net>=0?'color:#129b5a':'color:#d4382e'}">${fmtMoneyFull(net)}</div>
    <div class="hint" style="margin-top:4px">= 已收款 ${fmtMoneyFull(got)} + 其他收入 ${fmtMoneyFull(oIn)} − 已付款 ${fmtMoneyFull(paid)} − 其他支出 ${fmtMoneyFull(oOut)}</div>
  </div></div>
  <div class="card"><div class="ch">${ICO.chart} 合同台账（当前公司）</div><div class="tbl-wrap">
    ${cons.length?`<table class="tbl"><thead><tr><th>编号</th><th>名称</th><th>方向</th><th>往来单位</th><th class="num">合同金额</th><th class="num">已收/付</th><th class="num">未收/付</th><th>状态</th></tr></thead><tbody>
    ${cons.map(c=>{const m=conMoney(c);const recv=isRecvCon(c);return `<tr><td class="muted">${esc(c.number)}</td><td>${esc(c.name)}</td><td>${dirTag(c.direction)}</td><td>${esc(c.partnerName||'—')}</td><td class="num money">${fmtMoneyFull(c.amount)}</td><td class="num">${fmtMoneyFull(recv?m.got:m.paid)}</td><td class="num">${fmtMoneyFull(recv?m.amt-m.got:m.amt-m.paid)}</td><td>${stTag(c.status)}</td></tr>`}).join('')}
    </tbody></table>`:'<div class="blank">暂无合同数据</div>'}
  </div></div>`;
}
function last12Months(){const arr=[];const d=new Date();for(let i=11;i>=0;i--){const t=new Date(d.getFullYear(),d.getMonth()-i,1);arr.push({y:t.getFullYear(),m:t.getMonth()+1,key:t.getFullYear()+'-'+pad(t.getMonth()+1)})}return arr}
function statChartHtml(){
  const months=last12Months();
  const bills=scopeList('fundBills');
  const series=months.map(m=>({k:m.key,in:moneyAgg(bills.filter(b=>b.kind==='收款'&&(b.date||'').startsWith(m.key)),b=>b.amount),out:moneyAgg(bills.filter(b=>b.kind==='付款'&&(b.date||'').startsWith(m.key)),b=>b.amount)}));
  const cons=scopeList('contracts');
  const byType={};cons.forEach(c=>{const t=c.typeName||'未分类';byType[t]=(byType[t]||0)+moneyIn(c.amount)});
  const typeEntries=Object.entries(byType).sort((a,b)=>b[1]-a[1]);
  const statusCount={unsigned:0,signed:0,done:0,stopped:0};cons.forEach(c=>{if(statusCount[c.status]!=null)statusCount[c.status]++});
  const typeTotal=typeEntries.reduce((s,e)=>s+e[1],0);
  const statusTotal=cons.length||1;
  return `<div class="chart-box">
    <div class="card" style="margin:0"><div class="ch">近 12 个月收付款趋势（元）</div><div class="bd">
      ${svgTrend(series)}
    </div></div>
    <div class="card" style="margin:0"><div class="ch">合同类型金额分布</div><div class="bd">
      ${typeTotal?typeEntries.map(e=>{const p=e[1]/typeTotal*100;return `<div style="display:flex;align-items:center;gap:10px;margin-bottom:8px"><span style="width:90px;font-size:12.5px;color:#5a6478;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(e[0])}</span><div class="pbar" style="flex:1;min-width:60px"><i class="green" style="width:${p}%"></i></div><span class="pct" style="width:120px">${fmtMoneyFull(e[1])}（${p.toFixed(1)}%）</span></div>`}).join(''):'<div class="blank">暂无合同</div>'}
    </div></div>
    <div class="card" style="margin:0"><div class="ch">合同状态分布（份）</div><div class="bd">
      ${Object.entries(statusCount).map(([k,v])=>{const p=v/statusTotal*100;const c=k==='signed'?'#2f6fdb':k==='done'?'#129b5a':k==='stopped'?'#9aa3b5':'#c47b0a';return `<div style="display:flex;align-items:center;gap:10px;margin-bottom:8px"><span style="width:70px;font-size:12.5px;color:#5a6478">${fmtStatus(k)}</span><div class="pbar" style="flex:1;min-width:60px"><i style="background:${c};width:${p}%"></i></div><span class="pct" style="width:60px">${v} 份</span></div>`}).join('')}
    </div></div>
    <div class="card" style="margin:0"><div class="ch">数据概览</div><div class="bd" style="font-size:13px;line-height:2.2;color:#5a6478">
      <div>· 客户 <span class="strong" style="color:#1c2433">${scopeList('customers').length}</span> 家 · 供应商 <span class="strong" style="color:#1c2433">${scopeList('suppliers').length}</span> 家</div>
      <div>· 合同共 <span class="strong" style="color:#1c2433">${cons.length}</span> 份（应收 ${cons.filter(c=>isRecvCon(c)).length} / 应付 ${cons.filter(c=>!isRecvCon(c)).length}）</div>
      <div>· 发票 ${scopeList('invoices').length} 张 · 收付款单据 ${bills.length} 笔 · 转账 ${scopeList('transfers').length} 笔</div>
      <div class="hint" style="margin-top:6px">以上图表基于本机当前公司数据实时计算。</div>
    </div></div>
  </div>`;
}
function svgTrend(series){
  const W=430,H=200,padL=8,padB=22,padT=14;
  const max=Math.max(1,...series.map(s=>Math.max(s.in,s.out)));
  const gw=(W-padL*2)/(series.length*2-1);
  const bw=gw*0.62;
  const barW=(W-padL*2)/series.length;
  const bars=series.map((s,i)=>{
    const x=padL+i*barW;
    const h1=max?H-padB-padT-(s.in/max)*(H-padB-padT):0;
    const h2=max?H-padB-padT-(s.out/max)*(H-padB-padT):0;
    const y1=H-padB-h1,y2=H-padB-h2;
    return `<rect x="${x+bw*0.18}" y="${y1}" width="${bw*0.9}" height="${h1||0.5}" fill="#3d5ee8" rx="2"/><rect x="${x+bw*1.2}" y="${y2}" width="${bw*0.9}" height="${h2||0.5}" fill="#e35d5a" rx="2"/><text x="${x+barW/2}" y="${H-6}" font-size="9" fill="#9aa3b5" text-anchor="middle">${s.k.slice(5)}</text>`;
  }).join('');

function exportBackup(){

function importBackup(inp){
  if(!canWrite())return;
  const f=inp.files[0];if(!f)return;
  readFileText(f,txt=>{
    let data;
    try{data=JSON.parse(txt)}catch(e){toast('备份文件解析失败','err');inp.value='';return}
    if(!data.companies||!data.contracts){toast('文件格式不正确，请选择本软件导出的备份','err');inp.value='';return}
    const keep=confirmDlg2('导入备份','导入将覆盖当前全部业务数据与设置（激活授权状态不受影响）。\n\n是否继续？');
    if(!keep){inp.value='';return}
    ['companies','users','customers','suppliers','contracts','invoices','fundBills','otherBills','transfers','accounts','reminders','logs'].forEach(k=>{if(Array.isArray(data[k]))saveList(k,data[k])});
    if(data.dicts&&typeof data.dicts==='object')Store.set('dicts',data.dicts);
    if(data.settings&&typeof data.settings==='object')saveSettings(Object.assign(getSettings(),data.settings));
    if(data.curCompanyId)Store.set('curCompanyId',data.curCompanyId);
    Store.set('initDone',1);
    addLog('导入数据备份','恢复 '+((data.contracts||[]).length)+' 份合同');
    inp.value='';toast('导入成功');refreshAside();goPage('dash');renderNav();
  });
}
