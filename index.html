<!DOCTYPE html>
<html lang="zh-CN" data-page-node-id="Ds8gschKHMhgDNEJx0FCpe">
<head data-page-node-id="cFtgir5tSxgQ6YLofJuMFq">
<meta charset="UTF-8" data-page-node-id="ryCRWeFZQypxpOruISByr7">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" data-page-node-id="GbcmohNacPCtWalsIE36BE">
<title>合同管理平台 · Contract Hub</title>
<meta name="description" content="合同管理平台：合同、发票、资金、客户与供应商一站式管理" data-page-node-id="Vu8KiOsASC9XfcErCmKRN3">
<style>:root{
  --bg:#f4f6fa; --card:#ffffff; --line:#e7eaf2; --line2:#d7dce8;
  --ink:#1c2433; --ink2:#5a6478; --ink3:#9aa3b5;
  --brand:#3d5ee8; --brand-d:#2c48c4; --brand-bg:#eef1fd;
  --ok:#129b5a; --ok-bg:#e6f7ef; --bad:#d4382e; --bad-bg:#fdeeec;
  --warn:#c47b0a; --warn-bg:#fdf3e0; --info:#2f6fdb; --info-bg:#e9f1fc;
  --gray:#6b7280;
  --r:14px; --rs:12px;
  --shadow:0 1px 2px rgba(20,30,60,.04),0 4px 14px rgba(20,30,60,.05);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);font-size:21px;line-height:1.55;-webkit-font-smoothing:antialiased}
button{font-family:inherit}
input,select,textarea{font-family:inherit;font-size:19px}
a{color:var(--brand);text-decoration:none}
svg{display:block}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#ccd3e2;border-radius:10px}
::-webkit-scrollbar-track{background:transparent}

#app{display:none}
body.ready #app{display:flex;height:100vh;overflow:hidden}

/* ============ 认证页（登录/授权） ============ */
#authWrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:
  radial-gradient(1200px 500px at 85% -10%,#e8edff 0%,transparent 55%),
  radial-gradient(900px 420px at -10% 110%,#e9f7f1 0%,transparent 50%),var(--bg)}
#authCard{width:100%;max-width:392px;background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:34px 32px 26px}
.auth-logo{width:54px;height:54px;border-radius:14px;background:linear-gradient(135deg,#4c6ff0,#2f48c8);display:flex;align-items:center;justify-content:center;margin:0 auto 14px;color:#fff}
.auth-name{text-align:center;font-size:24px;font-weight:600}
.auth-sub{text-align:center;font-size:15px;color:var(--ink3);margin:4px 0 22px}
.tabs{display:flex;background:var(--bg);border-radius:9px;padding:3px;margin-bottom:18px}
.tabs button{flex:1;border:none;background:transparent;padding:7px 0;border-radius:7px;font-size:16px;color:var(--ink2);cursor:pointer}
.tabs button.on{background:#fff;color:var(--brand);font-weight:500;box-shadow:0 1px 3px rgba(20,30,60,.08)}
.f-label{font-size:15px;color:var(--ink2);margin:14px 0 6px;display:block}
.f-label:first-child{margin-top:0}
.inp{width:100%;border:1px solid var(--line2);border-radius:var(--rs);padding:10px 13px;background:#fff;color:var(--ink);outline:none;transition:border .15s,box-shadow .15s;font-size:15px}
.inp:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(61,94,232,.12)}
textarea.inp{resize:vertical;min-height:72px;line-height:1.6}
select.inp{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink3) 50%),linear-gradient(135deg,var(--ink3) 50%,transparent 50%);background-position:calc(100% - 16px) 55%,calc(100% - 11px) 55%;background-size:5px 5px;background-repeat:no-repeat;padding-right:30px}
.btn{border:1px solid var(--line2);background:#fff;color:var(--ink);border-radius:var(--rs);padding:9px 18px;font-size:16px;cursor:pointer;transition:all .15s;white-space:nowrap}
.btn:hover{border-color:#b9c2d6;background:#f7f9fd}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.pri:hover{background:var(--brand-d)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.ok:hover{background:#0e7f4a}
.btn.bad{background:#fff;border-color:#f0b9b5;color:var(--bad)}
.btn.bad:hover{background:var(--bad-bg)}
.btn.warn{background:#fff;border-color:#eac388;color:var(--warn)}
.btn.warn:hover{background:var(--warn-bg)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink2)}
.btn.ghost:hover{background:var(--bg);color:var(--ink)}
.btn.sm{padding:4px 13px;font-size:15px;border-radius:7px}
.btn.block{width:100%;padding:12px}
.hint{font-size:17px;color:var(--ink3);line-height:1.7}
.msg{font-size:15px;line-height:1.6;margin-top:8px}
.msg.err{color:var(--bad)} .msg.ok{color:var(--ok)}

/* ============ 主框架 ============ */
#aside{width:264px;flex:none;background:var(--card);border-right:1px solid var(--line);display:flex;flex-direction:column}
.aside-logo{display:flex;align-items:center;gap:10px;padding:15px 16px;border-bottom:1px solid var(--line)}
.aside-logo .lg{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,#4c6ff0,#2f48c8);color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.aside-logo .nm{font-size:17px;font-weight:600;line-height:1.25}
.aside-logo .vn{font-size:17px;color:var(--ink3)}
#nav{flex:1;overflow-y:auto;padding:8px 10px 12px}
.nav-group{font-size:17px;color:var(--ink3);padding:12px 8px 5px;letter-spacing:1px}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;color:var(--ink2);cursor:pointer;font-size:16px;margin-bottom:1px;user-select:none}
.nav-item:hover{background:var(--bg);color:var(--ink)}
.nav-item.on{background:var(--brand-bg);color:var(--brand);font-weight:500}
.nav-item svg{flex:none}
.nav-item .cnt{margin-left:auto;font-size:17px;background:#eef1f6;color:var(--ink2);border-radius:99px;padding:1px 9px;min-width:22px;text-align:center}
.nav-item.on .cnt{background:#dbe3fb;color:var(--brand)}
.nav-item .nv-arr{font-style:normal;margin-left:auto;font-size:17px;color:var(--ink3);transition:transform .15s}
.nav-item .nv-arr.up{transform:rotate(180deg)}
.nav-sub{display:none;margin:2px 0 6px;padding-left:14px;border-left:2px solid var(--line)}
.nav-sub.open{display:block}
.nav-sub .nav-item{padding:7px 12px;font-size:15px;color:var(--ink2)}
.nav-sub .nav-item.on{background:var(--brand-bg);color:var(--brand)}
.nav-sub .nav-item:not(.on):hover{background:var(--bg)}
#main{flex:1;display:flex;flex-direction:column;min-width:0}
#topbar{height:64px;flex:none;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 20px;gap:12px}
.ttl{font-size:20px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#topbar .crumb{color:var(--ink3);font-size:17px}
#content{flex:1;overflow-y:auto;padding:20px 22px 60px}
#menuBtn{display:none}

/* ============ 卡片/区块 ============ */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;margin-bottom:14px}
.stat-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow)}
.stat-card .lb{font-size:15px;color:var(--ink2);display:flex;align-items:center;gap:8px}
.stat-card .val{font-size:28px;font-weight:600;margin-top:6px;letter-spacing:-.3px}
.stat-card .val small{font-size:17px;color:var(--ink3);font-weight:400}
.stat-card .ex{font-size:17px;color:var(--ink3);margin-top:3px}
.stat-card .ico{width:40px;height:40px;border-radius:11px;display:flex;align-items:center;justify-content:center;margin-left:auto}
.stat-card:hover{box-shadow:0 4px 14px rgba(61,94,232,.08),0 2px 6px rgba(20,30,60,.06);border-color:#d6defc}
/* 环形占比图 hover 交互：悬停某段高亮并放大，其余段淡化，原生 title 显示名称/数值/占比 */
.ringbox{cursor:default}
.ringbox .ring-seg{transition:opacity .18s ease,transform .18s ease;transform-box:fill-box;transform-origin:center;cursor:pointer}
.ringbox:hover .ring-seg{opacity:.45}
.ringbox .ring-seg:hover{opacity:1;transform:scale(1.045);filter:drop-shadow(0 2px 5px rgba(20,30,60,.22))}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);margin-bottom:14px}
.card .ch{padding:15px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;font-size:17px;font-weight:500}
.card .ch .r{margin-left:auto;display:flex;gap:8px;align-items:center}
.card .bd{padding:16px 18px}
.seg{display:flex;gap:6px;background:var(--bg);padding:4px;border-radius:10px;width:max-content;flex-wrap:wrap;max-width:100%}
.seg button{border:none;background:transparent;padding:7px 16px;border-radius:8px;font-size:15px;color:var(--ink2);cursor:pointer}
.seg button.on{background:#fff;color:var(--brand);font-weight:500;box-shadow:0 1px 3px rgba(20,30,60,.1)}

/* ============ 表格 ============ */
.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:15px;white-space:nowrap}
.tbl th{background:#f7f9fc;color:var(--ink2);font-weight:500;text-align:left;padding:11px 14px;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:1}
.tbl td{padding:11px 14px;border-bottom:1px solid #eef1f6;color:var(--ink)}
.tbl tr:hover td{background:#fafbfe}
.tbl .num{font-variant-numeric:tabular-nums;text-align:right}
.tbl th.num{text-align:right}
.tbl .tac{text-align:center}
.tbl th.tac{text-align:center}
.tbl .hide-col{display:none}
/* 列设置抽屉按钮组 */
.colset-panel{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}
.colset-panel label{display:flex;align-items:center;gap:8px;border:1px solid #e7eaf2;border-radius:9px;padding:9px 12px;font-size:17px;cursor:pointer;background:#fbfcfe}
.colset-panel label:hover{border-color:var(--brand);background:var(--brand-bg)}
.colset-panel input{width:16px;height:16px;accent-color:var(--brand);flex:none}
.muted{color:var(--ink3)}
.strong{font-weight:500}
.money{font-variant-numeric:tabular-nums;font-weight:500}
.blank{padding:40px 0;text-align:center;color:var(--ink3);font-size:15px}
.blank svg{margin:0 auto 10px;opacity:.4}
.ops button{margin-right:0}

/* ============ 标签 ============ */
.tag{display:inline-flex;align-items:center;gap:4px;font-size:17px;padding:2px 12px;border-radius:99px;white-space:nowrap}
.tag.ok{background:var(--ok-bg);color:var(--ok)}
.tag.bad{background:var(--bad-bg);color:var(--bad)}
.tag.warn{background:var(--warn-bg);color:var(--warn)}
.tag.info{background:var(--info-bg);color:var(--info)}
.tag.gray{background:#f0f2f6;color:var(--gray)}
.tag.brand{background:var(--brand-bg);color:var(--brand)}
.tag.plain{background:transparent;border:1px solid var(--line2);color:var(--ink2)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.money-pos{color:var(--ok);font-weight:500}
.money-neg{color:var(--bad);font-weight:500}

/* ============ 筛选条 ============ */
.filter{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
.filter .inp{width:auto;min-width:150px;padding:8px 12px;font-size:15px}
.filter .sp{flex:1}
.toolbar{display:flex;gap:8px;align-items:center;padding:14px 16px;flex-wrap:wrap}
.toolbar .sp{flex:1}

/* ============ 弹窗 ============ */
#mask{position:fixed;inset:0;background:rgba(15,23,42,.42);z-index:90;display:none;align-items:flex-start;justify-content:center;padding:5vh 14px 20px;overflow-y:auto}
body.modal-open #mask{display:flex}
.modal{background:#fff;border-radius:16px;width:100%;max-width:820px;box-shadow:0 18px 60px rgba(10,20,50,.22);animation:pop .16s ease}
.modal.sm{max-width:520px}.modal.lg{max-width:1100px}.modal.xl{max-width:1280px}
@keyframes pop{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
.modal .mh{display:flex;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line);font-size:18px;font-weight:600;cursor:default}
.modal .mh .x{margin-left:auto;border:none;background:var(--bg);width:30px;height:30px;border-radius:8px;color:var(--ink2);cursor:pointer;font-size:17px;display:flex;align-items:center;justify-content:center}
.modal .mh .x:hover{background:#fbe6e4;color:var(--bad)}
.modal .mb{padding:18px 20px;max-height:calc(100vh - 160px);overflow-y:auto}
.modal .mf{display:flex;gap:8px;justify-content:flex-end;padding:14px 20px;border-top:1px solid var(--line)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 22px}
.form-grid .full{grid-column:1/-1}
.fg{margin-bottom:12px}
.fg label{display:block;font-size:15px;color:var(--ink2);margin-bottom:6px}
.fg label i{color:var(--bad);font-style:normal;margin-left:2px}
.fg .inp{width:100%}
.two{display:flex;gap:8px}
.two .inp{flex:1}

/* 详情抽屉 */
#maskDw{position:fixed;inset:0;background:rgba(15,23,42,.18);z-index:94;display:none}
body.drawer-open #maskDw{display:block}
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(680px,100vw);background:#fff;z-index:95;box-shadow:-8px 0 30px rgba(10,20,50,.16);transform:translateX(105%);transition:transform .2s ease;display:flex;flex-direction:column}
body.drawer-open #drawer{transform:none}
#dwResize{position:absolute;left:-3px;top:0;bottom:0;width:7px;cursor:ew-resize;z-index:2}
#dwResize::after{content:'';position:absolute;left:2px;top:0;bottom:0;width:3px;background:transparent;border-radius:3px}
#dwResize:hover::after{background:var(--brand);opacity:.35}
#dwResize.drag::after{background:var(--brand);opacity:.6}
#drawer .mh{display:flex;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line);font-weight:600;font-size:18px;user-select:none}
#drawer .mb{flex:1;overflow-y:auto;padding:18px 20px;-webkit-overflow-scrolling:touch}
.kv{display:grid;grid-template-columns:repeat(2,1fr);gap:2px 22px;font-size:16px}
.kv .it{display:flex;padding:8px 0;border-bottom:1px dashed #f0f2f7}
.kv .k{color:var(--ink3);width:120px;flex:none}
.kv .v{flex:1;word-break:break-all}

/* ============ Toast ============ */
#toast{position:fixed;top:18px;left:50%;transform:translateX(-50%) translateY(-80px);z-index:200;background:#232c3d;color:#fff;font-size:16px;padding:11px 22px;border-radius:12px;box-shadow:0 6px 24px rgba(0,0,0,.18);opacity:0;transition:all .25s;pointer-events:none;max-width:88vw}
#toast.show{transform:translateX(-50%) translateY(0);opacity:1}
#toast.ok{background:#0e8a52}#toast.err{background:#c73a2f}#toast.warn{background:#b06b08}

/* ============ 明细行编辑器 ============ */
.items-editor td .inp{padding:7px 10px;font-size:15px}
.items-editor .rm{color:var(--bad);background:none;border:none;cursor:pointer;font-size:18px}
.mini-tbl{width:100%;border-collapse:collapse}
.mini-tbl th{font-size:17px;color:var(--ink2);background:var(--bg);padding:8px 10px;border:1px solid var(--line)}
.mini-tbl td{border:1px solid var(--line);padding:0}
.mini-tbl td .inp{border:none;border-radius:0;box-shadow:none;padding:8px 10px;background:transparent;font-size:15px}
.mini-tbl td .inp:focus{background:#fff}
.mini-tbl td select.inp{appearance:none;border:none;border-radius:0;background:transparent;padding:8px 4px;font-size:15px}

/* ============ 进度条 ============ */
.pbar{height:8px;border-radius:8px;background:#eef1f6;overflow:hidden;min-width:90px}
.pbar i{display:block;height:100%;background:var(--brand);border-radius:8px}
.pbar i.green{background:var(--ok)}.pbar i.amber{background:var(--warn)}.pbar i.red{background:var(--bad)}
.pct{font-size:17px;color:var(--ink3);white-space:nowrap}

/* ============ 附件 ============ */
.att{display:inline-flex;align-items:center;gap:6px;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:5px 12px;font-size:15px;color:var(--ink);margin:0 6px 6px 0}
.att .rm{color:var(--bad);background:none;border:none;cursor:pointer;font-size:15px}

/* ============ 图表/进度等 ============ */
.chart-box{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.chart-box .card{min-width:0;overflow-x:auto}
.ch-dot{display:inline-block;width:12px;height:12px;border-radius:4px;flex:none;vertical-align:-1px}
.dash-grid{display:grid;grid-template-columns:1.6fr 1fr;gap:14px;margin-bottom:14px}
.dash-grid .card{min-width:0}
.dash-grid .card .bd svg{display:block;margin:0 auto}
@media(max-width:960px){.dash-grid{grid-template-columns:1fr}}
.st3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
@media(max-width:820px){.chart-box{grid-template-columns:1fr}}
@media(max-width:640px){.st3{grid-template-columns:1fr}}

/* ============ 数据导入 ============ */
.dropzone{border:1.5px dashed var(--line2);border-radius:var(--r);padding:30px;text-align:center;color:var(--ink2);cursor:pointer;transition:all .15s;background:#fbfcfe}
.dropzone:hover{border-color:var(--brand);background:var(--brand-bg)}
.dropzone.on{border-color:var(--brand);background:var(--brand-bg)}

/* ============ 用户/角色 ============ */
.role-row{display:flex;gap:14px;flex-wrap:wrap}
.role-row .rr{flex:1;min-width:230px;border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;background:#fff}
.role-row .rr h4{font-size:16px;margin-bottom:4px;display:flex;align-items:center;gap:8px}
.perm-line{font-size:17px;color:var(--ink2)}

/* ============ 响应式 ============ */
@media(max-width:920px){
  #aside{position:fixed;left:0;top:0;bottom:0;z-index:80;transform:translateX(-105%);transition:transform .2s;box-shadow:6px 0 24px rgba(10,20,50,.12);width:280px}
  body.menu-open #aside{transform:none}
  #menuBtn{display:flex;border:none;background:var(--bg);width:40px;height:40px;border-radius:9px;align-items:center;justify-content:center;color:var(--ink2);cursor:pointer}
  #content{padding:14px 12px 70px}
  #topbar{padding:0 12px}
  .form-grid{grid-template-columns:1fr}
  .kv{grid-template-columns:1fr}
  /* 移动端字号适度回缩，避免大屏放大值在小屏溢出 */
  body{font-size:18px}
  .inp{font-size:16px}
  .btn{font-size:15px}
  .btn.sm{font-size:15px}
  table.tbl{font-size:15px}
  .ttl{font-size:18px}
  .stat-card .val{font-size:24px}
}

/* ============ 附件 chip ============ */
.att .ak{font-style:normal;font-size:14px;padding:0 7px;border-radius:6px;background:#eef1f6;color:var(--ink2);flex:none}
.att .ak.img{background:var(--ok-bg);color:var(--ok)}
.att .ak.pdf{background:var(--bad-bg);color:var(--bad)}
.att-sz{font-size:13px;color:var(--ink3);flex:none}

/* ============ 弹窗 / 抽屉可拖动 ============ */
.modal .mh,#drawer .mh{cursor:move;-webkit-user-select:none;user-select:none;touch-action:none}
.modal .mh .x,#drawer .mh .x{cursor:pointer}
#maskDw{z-index:94}

/* ============ 手机端全页面适配增强 ============ */
@media(max-width:920px){
  .cards{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
  .stat-card{padding:12px 14px}
  .stat-card .val{letter-spacing:-.2px}
  #mask{align-items:stretch;padding:0 8px 8px}
  .modal{max-width:100%}
  .modal .mb{max-height:calc(100vh - 190px);padding:14px 14px}
  .modal .mh{padding:14px 16px}
  .card .ch{padding:13px 14px}
  .card .bd{padding:13px 14px}
  .filter{padding:10px 12px;gap:7px}
  .filter .inp{min-width:0;flex:1 1 auto}
  .filter .sp{flex:1 1 100%;order:9;height:0}
  .filter .btn{flex:none}
  .seg{max-width:100%}
  .seg button{padding:6px 12px;flex:none}
  .tbl th{padding:9px 10px}
  .tbl td{padding:9px 10px}
  .kv .k{width:96px}
  .att{max-width:100%}
  .att b{max-width:120px!important}
  .two .btn{flex:none}
  #content{padding:12px 10px 64px}
  .chart-box .card .bd{padding:10px 6px}
  .hint{line-height:1.8}
}
@media(max-width:480px){
  .cards{grid-template-columns:repeat(2,1fr)}
  .filter .inp{font-size:15px}
